<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console.log</title>
</head>
<body>

    <script>
for (var i = 0; i < 3; i++) {
    setTimeout (() => console.log(i), 100);
}

for (let i = 0; i < 3; i++) {
    setTimeout (() => console.log(i), 100);
}

for (var i = 0; i < 3; i++) {
    setTimeout (() => console.log(i), i * 100);
}
 
for (var i = 0; i < 3; i++) {
    let j = i;
    setTimeout (() => console.log(i, j), 0);
}

for (var i = 0; i < 3; i++) {
    setTimeout (() => console.log('di dalam:', i), 0);
}
</script>

</body>
</html>
